<script>
  if ('serviceWorker' in navigator) addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('music/sw.js', { scope: 'music/' });
      const check = () => reg.update().catch(() => {});
      document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
      let had = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        let done = false; try { done = sessionStorage.getItem('music.swr') === '1'; sessionStorage.setItem('music.swr', '1'); } catch (e) {}
        if (had && !done) location.reload(); had = true;
      });
      try { sessionStorage.removeItem('music.swr'); } catch (e) {}
    } catch (e) {}
  });
</script>
