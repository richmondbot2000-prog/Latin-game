<body>
<header class="top">
  <button class="ib" id="helpBtn" aria-label="How to play">?</button>
  <h1>Albumle</h1>
  <button class="ib" id="statsBtn" aria-label="Statistics">▥</button>
</header>
<main id="app"></main>
<div id="sheet" class="sheet" hidden><div class="panel"><button class="close" id="closeSheet" aria-label="Close">×</button><div id="sheetBody"></div></div></div>
<div id="toast" class="toast" hidden></div>
<script src="albums.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
  navigator.serviceWorker.register('sw.js').then(r => { document.addEventListener('visibilitychange', () => { if (!document.hidden) r.update(); }); });
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!sessionStorage.getItem('albumle.swr')) { sessionStorage.setItem('albumle.swr', '1'); location.reload(); } });
}
</script>
</body>
