<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word List</title>
<style>
  :root { --ink: #2B1A3A; --paper: #FBF7F0; --accent: #8E2F4A; --muted: #6E6378; --line: #E6DDD0; --chip: #F1E8DA; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #F2EAF5; --paper: #1A1020; --accent: #E8A0B4; --muted: #A89CB0; --line: #33263D; --chip: #2A1D33; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 400 17px/1.5 Georgia, 'Times New Roman', serif; }
  main { max-width: 40rem; margin: 0 auto; padding: 20px 16px 48px; }
  a { color: var(--accent); }
  h1 { font-size: 2rem; margin: .2em 0 .1em; }
  .sub { color: var(--muted); font-style: italic; margin: 0 0 1rem; }
  .controls { position: sticky; top: 0; background: var(--paper); padding: 8px 0 10px; border-bottom: 1px solid var(--line); }
  input { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
          background: var(--chip); color: var(--ink); }
  .levels { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .levels button { font: inherit; font-size: 15px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
                   background: var(--chip); color: var(--ink); cursor: pointer; }
  .levels button[aria-pressed="true"] { background: var(--accent); color: var(--paper); border-color: var(--accent); }
  .count { color: var(--muted); font-size: 14px; margin-top: 8px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 10px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
  .lat { font-weight: 700; overflow-wrap: anywhere; }
  .lv { font-size: 13px; color: var(--muted); align-self: start; padding-top: 3px; }
  .dict { grid-column: 1 / -1; font-size: 14px; color: var(--muted); font-style: italic; overflow-wrap: anywhere; }
  .en { grid-column: 1 / -1; }
  footer { margin-top: 24px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <a href="./">&larr; Home</a>
  <h1>Verba</h1>
  <p class="sub">Every word in the ISEB Common Entrance Latin list, Levels 1&ndash;3</p>
  <div class="controls">
    <input id="q" type="search" placeholder="Search Latin or English…" autocomplete="off">
    <div class="levels" id="levels">
      <button data-l="0" aria-pressed="true">All</button>
      <button data-l="1" aria-pressed="false">Level 1</button>
      <button data-l="2" aria-pressed="false">Level 2</button>
      <button data-l="3" aria-pressed="false">Level 3</button>
    </div>
    <div class="count" id="count"></div>
  </div>
  <ul id="list"></ul>
  <footer>
    Word list: ISEB CE/CASE Classics Specification, Appendix I.
    Meanings: R&nbsp;C&nbsp;Bass, rcbass.co.uk (CC BY-NC-SA 4.0).
  </footer>
</main>
<script src="vocab.js"></script>
<script>
  const list = document.getElementById('list');
  const q = document.getElementById('q');
  const count = document.getElementById('count');
  let level = 0;
  const words = VOCAB.slice().sort((a, b) =>
    a.word.replace(/^-/, '').localeCompare(b.word.replace(/^-/, ''), 'en', { sensitivity: 'base' }));

  function render() {
    const term = q.value.trim().toLowerCase();
    const shown = words.filter(w => (!level || w.level === level) &&
      (!term || w.word.toLowerCase().includes(term) || w.dict.toLowerCase().includes(term) ||
       w.english.toLowerCase().includes(term)));
    list.innerHTML = '';
    for (const w of shown) {
      const li = document.createElement('li');
      li.innerHTML = '<span class="lat"></span><span class="lv"></span><span class="dict"></span><span class="en"></span>';
      li.children[0].textContent = w.word;
      li.children[1].textContent = 'L' + w.level;
      li.children[2].textContent = w.dict !== w.word ? w.dict : '';
      li.children[3].textContent = w.english;
      list.appendChild(li);
    }
    count.textContent = shown.length + ' of ' + words.length + ' words';
  }
  document.getElementById('levels').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    level = +b.dataset.l;
    for (const x of b.parentNode.children) x.setAttribute('aria-pressed', x === b);
    render();
  });
  q.addEventListener('input', render);
  render();
</script>
</body>
</html>
