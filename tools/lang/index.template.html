<script src="{{CODE}}/app.js"></script>
<script>
  if ('serviceWorker' in navigator) addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('{{CODE}}/sw.js', { scope: '{{CODE}}/' });
      const check = () => reg.update().catch(() => {});
      document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
      let had = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        let done = false; try { done = sessionStorage.getItem('{{CODE}}.swr') === '1'; sessionStorage.setItem('{{CODE}}.swr', '1'); } catch (e) {}
        if (had && !done) location.reload(); had = true;
      });
      try { sessionStorage.removeItem('{{CODE}}.swr'); } catch (e) {}
    } catch (e) {}
  });
</script>
