<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#3a1a3c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Dance Evolution</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="coins"><span class="ic coinspin"></span><b id="coins">0</b><span class="rate" id="rate">+0/s</span></div>
    <div class="topbtns"><a class="ib" href="../" aria-label="All games"><img src="art/home.png" alt=""></a><button id="pediaBtn" class="ib" aria-label="Dancepedia"><img src="art/book.png" alt=""></button><button id="shopBtn" class="ib" aria-label="Upgrades"><img src="art/up.png" alt=""></button></div>
  </header>
  <nav class="worlds" id="worlds"></nav>
  <main class="field" id="field"><div class="ground"></div><div class="hint" id="hint"></div></main>
  <footer class="bar">
    <button id="crateBtn" class="big"><span class="ic"><img src="art/bag.png" alt=""></span><span id="crateLbl">Dance bag</span></button>
    <button id="buyBtn" class="big"><span class="ic"><img src="art/shoe.png" alt=""></span><span id="buyLbl">Invite</span></button>
  </footer>
</div>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
