<div id="app"></div>
<div id="sheet" class="sheet" hidden></div>
<script>const APP_NS = 'tounsi'; const LANG = {"code": "tounsi", "name": "Tounsi", "tts": {"lang": "ar-TN", "fallback": "ar", "script": "chat-arabic", "auto": true, "rate": 0.85}};</script>
<script src="tounsi/vocab.js"></script>
<script src="effects.js"></script>
<script src="rig.js"></script>
<script src="speak.js"></script>
<script src="practice.js"></script>
<script src="tounsi/forms.js"></script>
<script src="tounsi/read.js"></script>
<script src="tounsi/phrases.js"></script>
<script src="tounsi/synonyms.js"></script>
<script src="tounsi/snap.js"></script>
<script src="hammer.js"></script>
<script src="beasts.js"></script>
<script src="sync.js"></script>
<script src="tounsi/app.js"></script>
<script>
  if ('serviceWorker' in navigator) addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('tounsi/sw.js', { scope: 'tounsi/' });
      const check = () => reg.update().catch(() => {});
      document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
      let had = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        let done = false; try { done = sessionStorage.getItem('tounsi.swr') === '1'; sessionStorage.setItem('tounsi.swr', '1'); } catch (e) {}
        if (had && !done) location.reload(); had = true;
      });
      try { sessionStorage.removeItem('tounsi.swr'); } catch (e) {}
    } catch (e) {}
  });
</script>
</body>
</html>
